name: Deploy to AWS App Runner (Dev)

on:
  push:
    branches:
      - dev

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: shepherdwatch-finmodule-fe
  APP_RUNNER_SERVICE_ARN: arn:aws:apprunner:us-east-1:540871810415:service/shepherdwatch-finmodule-fe/03ab650cc59147aab051101cdcea3df0

jobs:
  deploy:
    name: Build and Deploy to Dev
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Building Docker image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "Pushing to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:latest" >> $GITHUB_OUTPUT

      - name: Deployment Note
        run: |
          echo "✅ Image pushed to ECR successfully!"
          echo "🚀 App Runner auto-deployment is enabled and will deploy automatically."
          echo "⏱️  This usually takes 3-5 minutes."
          echo ""
          echo "You can monitor deployment at:"
          echo "https://console.aws.amazon.com/apprunner/home?region=us-east-1#/services/detail/${{ env.APP_RUNNER_SERVICE_ARN }}/logs"

      - name: Deployment Summary
        run: |
          echo "================================"
          echo "✅ Deployment Complete!"
          echo "================================"
          echo "📦 Image: ${{ steps.build-image.outputs.image }}"
          echo "🔗 App URL: https://pj6cptkvew.us-east-1.awsapprunner.com"
          echo "🌿 Branch: dev"
          echo "================================"
